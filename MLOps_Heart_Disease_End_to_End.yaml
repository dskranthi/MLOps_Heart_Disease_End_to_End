- cell_type: markdown
  id: afc40147
  metadata: {}
  source:
  - '### MLflow: see the runs in your browser

    '
  - 'Run the next cell. It starts the MLflow UI for you (it needs the training cell above to have finished, because that creates
    `mlflow_data/mlflow.db`) and prints a link. **Give it 10-20 seconds the first time.** It uses port 5001 (or the next free
    port) because port 5000 is often taken by other programs.

    '
  - '

    '
  - 'If you prefer a terminal, run this **from the project folder** (same folder as `mlflow_data/`; from anywhere else it
    opens an empty store):

    '
  - '```

    '
  - 'mlflow ui --backend-store-uri sqlite:///mlflow_data/mlflow.db --port 5001

    '
  - '```

    '
  - '- **Docker:** `docker compose up -d mlflow`, wait about 20 seconds, then open http://localhost:5001. Train into it with
    `docker compose --profile train run --rm train`.

    '
  - '- **GitHub Actions:** the *MLflow run summary* step prints the run table on the workflow summary page, and `mlflow_data/`
    is uploaded as an artifact (download it, then use the local command).'
- cell_type: code
  execution_count: 18
  id: d57fe987
  metadata: {}
  outputs:
  - data:
      text/html:
      - 'MLflow UI is running: <a href="http://127.0.0.1:5002" target="_blank">http://127.0.0.1:5002</a>'
      text/plain:
      - <IPython.core.display.HTML object>
    metadata: {}
    output_type: display_data
  source:
  - 'import socket

    '
  - 'import subprocess

    '
  - 'import sys

    '
  - 'import time

    '
  - 'import urllib.request

    '
  - 'from pathlib import Path

    '
  - '

    '
  - 'from IPython.display import HTML, display

    '
  - '

    '
  - 'store = Path("mlflow_data/mlflow.db").resolve()

    '
  - 'assert store.exists(), "Run the training cell first: it creates mlflow_data/mlflow.db"

    '
  - '

    '
  - '

    '
  - 'def free_port(start=5001):

    '
  - '    for port in range(start, start + 20):

    '
  - '        with socket.socket() as s:

    '
  - '            if s.connect_ex(("127.0.0.1", port)) != 0:

    '
  - '                return port

    '
  - '    raise RuntimeError("no free port found")

    '
  - '

    '
  - '

    '
  - 'PORT = free_port()

    '
  - 'mlflow_ui = subprocess.Popen([sys.executable, "-m", "mlflow", "ui",

    '
  - '                              "--backend-store-uri", f"sqlite:///{store.as_posix()}",

    '
  - '                              "--host", "127.0.0.1", "--port", str(PORT)])

    '
  - 'for _ in range(120):

    '
  - '    try:

    '
  - '        urllib.request.urlopen(f"http://127.0.0.1:{PORT}/health", timeout=2)

    '
  - '        break

    '
  - '    except Exception:

    '
  - '        time.sleep(1)

    '
  - 'else:

    '
  - '    raise RuntimeError("MLflow UI did not start within 2 minutes; check the messages above")

    '
  - 'display(HTML(f''MLflow UI is running: <a href="http://127.0.0.1:{PORT}" target="_blank">http://127.0.0.1:{PORT}</a>''))'
